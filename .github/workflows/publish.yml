name: 'Publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0 libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: build tauri
        run: npm run tauri build -- --verbose --ignore-version-mismatches
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: list artifacts
        shell: bash
        run: find src-tauri/target/release/bundle -type f

      - name: create release
        shell: bash
        run: |
          gh release create ${{ github.ref_name }} \
            --draft \
            --title "RunBridge ${{ github.ref_name }}" \
            --notes "See the assets to download and install this version." \
            || echo "Release may already exist"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload artifacts
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/dmg/*.dmg \
                   src-tauri/target/release/bundle/macos/*.app.tar.gz \
                   src-tauri/target/release/bundle/msi/*.msi \
                   src-tauri/target/release/bundle/nsis/*.exe \
                   src-tauri/target/release/bundle/appimage/*.AppImage \
                   src-tauri/target/release/bundle/deb/*.deb; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload ${{ github.ref_name }} "$f" --clobber || echo "Upload failed for $f"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
