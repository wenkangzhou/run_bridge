name: 'Publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - name: build tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: set bundle path
        id: bundle_path
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            echo "path=src-tauri/target/aarch64-apple-darwin/release/bundle" >> $GITHUB_OUTPUT
          else
            echo "path=src-tauri/target/release/bundle" >> $GITHUB_OUTPUT
          fi

      - name: list bundle files
        shell: bash
        run: find ${{ steps.bundle_path.outputs.path }} -type f

      - name: check gh auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh release create ${{ github.ref_name }} \
            --draft \
            --title "RunBridge ${{ github.ref_name }}" \
            --notes "See the assets to download and install this version." \
            || echo "Release creation exit code: $?"

      - name: upload bundle artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          BUNDLE="${{ steps.bundle_path.outputs.path }}"
          for f in "$BUNDLE"/dmg/*.dmg \
                   "$BUNDLE"/macos/*.app.tar.gz \
                   "$BUNDLE"/msi/*.msi \
                   "$BUNDLE"/nsis/*.exe; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload ${{ github.ref_name }} "$f" --clobber
            fi
          done

      - name: verify release
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          echo "Release assets:"
          gh release view ${{ github.ref_name }} --json assets || echo "Release not found"
