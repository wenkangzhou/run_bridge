name: 'Publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - name: build tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: set bundle path
        id: bundle_path
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            echo "path=src-tauri/target/aarch64-apple-darwin/release/bundle" >> $GITHUB_OUTPUT
          else
            echo "path=src-tauri/target/release/bundle" >> $GITHUB_OUTPUT
          fi

      - name: list all bundle files
        shell: bash
        run: |
          BUNDLE="${{ steps.bundle_path.outputs.path }}"
          echo "=== Bundle path: $BUNDLE ==="
          find "$BUNDLE" -type f -ls || echo "find failed"
          echo "=== Directory tree ==="
          find "$BUNDLE" -type f

      - name: check gh auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GH Auth Status ==="
          gh auth status
          echo "=== GH version ==="
          gh --version

      - name: list existing releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Existing releases ==="
          gh release list --limit 20 || echo "No releases or failed to list"

      - name: create release if not exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "=== Checking if release $TAG exists ==="
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --draft \
              --title "RunBridge $TAG" \
              --notes "See the assets to download and install this version."
            echo "Release $TAG created successfully"
          fi

      - name: upload bundle artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          BUNDLE="${{ steps.bundle_path.outputs.path }}"
          echo "=== Uploading artifacts for $TAG from $BUNDLE ==="

          UPLOADED=0
          for f in "$BUNDLE"/dmg/*.dmg \
                   "$BUNDLE"/macos/*.app.tar.gz \
                   "$BUNDLE"/msi/*.msi \
                   "$BUNDLE"/nsis/*.exe; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              for i in 1 2 3; do
                gh release upload "$TAG" "$f" --clobber && break
                echo "Retry $i/3..."
                sleep 5
              done
              echo "✓ Uploaded: $(basename "$f")"
              UPLOADED=$((UPLOADED + 1))
            else
              echo "✗ Not found: $f"
            fi
          done

          echo "=== Total files uploaded: $UPLOADED ==="

      - name: verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "=== Verifying release $TAG ==="
          gh release view "$TAG" --json tagName,name,draft,assets || echo "Failed to view release"
