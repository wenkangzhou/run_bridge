name: 'Publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install frontend dependencies
        run: npm install

      - name: build tauri
        run: npm run tauri build -- --verbose --ignore-version-mismatches --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: list artifacts
        shell: bash
        run: find src-tauri/target/${{ matrix.target }}/release/bundle -type f

      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  create-release:
    needs: build-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-bundle'

      - name: debug artifacts
        run: |
          echo "=== Artifact directory structure ==="
          find artifacts -type f -ls
          echo "=== Flatten for upload ==="
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          ls -la upload/

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: true
          tag_name: ${{ github.ref_name }}
          name: 'RunBridge ${{ github.ref_name }}'
          body: 'See the assets to download and install this version.'
          token: ${{ secrets.GITHUB_TOKEN }}
