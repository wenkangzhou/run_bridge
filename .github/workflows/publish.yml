name: 'Publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - name: build tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: list bundle files
        shell: bash
        run: find src-tauri/target/release/bundle -type f

      - name: create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist (one job wins, other fails silently)
          gh release create ${{ github.ref_name }} \
            --draft \
            --title "RunBridge ${{ github.ref_name }}" \
            --notes "See the assets to download and install this version." \
            2>/dev/null || echo "Release already exists or creation failed"

      - name: upload bundle artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in src-tauri/target/release/bundle/dmg/*.dmg \
                   src-tauri/target/release/bundle/macos/*.app.tar.gz \
                   src-tauri/target/release/bundle/msi/*.msi \
                   src-tauri/target/release/bundle/nsis/*.exe; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload ${{ github.ref_name }} "$f" --clobber
            fi
          done

      - name: verify release
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Release assets:"
          gh release view ${{ github.ref_name }} --json assets || echo "Release not found"
